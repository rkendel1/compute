# Compute -> Chip -> FX contract harness (see docs/chip-fx-integration.md).
#
# Its OWN cargo workspace: deterministic fakes-only contract tests of the real Chip work loop, the
# real Chip->FX adapter and the real FX executor, at the same stack-agent commit the product
# workspace (crates/compute-stack-agent) builds. Chip and FX are one repository, one commit.
[workspace]

[package]
name = "compute-chip-fx-harness"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
description = "Deterministic fakes-only harness for the Compute -> Rust Chip -> FX contract"

# Immutable revisions only (never a branch or tag), all one stack-agent commit; checked by
# tests/pins.rs against the product workspace's pin.
[dependencies]
async-trait = "0.1"
chip-core = { git = "https://github.com/rkendel1/stack-agent", rev = "1cf91e63d2242f9aca4cbeb2d1d939b84a00be14" }
chip-fx = { git = "https://github.com/rkendel1/stack-agent", rev = "1cf91e63d2242f9aca4cbeb2d1d939b84a00be14" }
chip-inference = { git = "https://github.com/rkendel1/stack-agent", rev = "1cf91e63d2242f9aca4cbeb2d1d939b84a00be14" }
fx-core = { git = "https://github.com/rkendel1/stack-agent", rev = "1cf91e63d2242f9aca4cbeb2d1d939b84a00be14" }
fx-single-attempt = { git = "https://github.com/rkendel1/stack-agent", rev = "1cf91e63d2242f9aca4cbeb2d1d939b84a00be14" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
