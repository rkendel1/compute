[workspace]
members = [
  "crates/compute-core",
  "crates/compute-runtime",
  "crates/compute-runtime-process",
  "crates/compute-runtime-wasm",
  "crates/compute-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/rkendel1/compute"

[workspace.dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.12"
thiserror = "2.0"
tokio = { version = "1.40", features = ["macros", "process", "rt-multi-thread", "time"] }
walkdir = "2.5"
which = "8.0"
wasmtime = "36.0.10"
wasmtime-wasi = "36.0.10"
