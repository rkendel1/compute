[package]
name = "compute-rust-chip"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Run Rust Chip (chip-rs) as a Compute workload: one isolated Compute session per Chip work"

# Rust Chip is a standalone agent runtime. This crate is the Compute side of the generic
# environment contract it publishes (`chip-core`'s `EnvironmentProvider`); Rust Chip depends on
# nothing here. It is unrelated to the npm Chip/Eve agent the configured distribution also ships.
[dependencies]
async-trait.workspace = true
chip-cli = { git = "https://github.com/rkendel1/chip-rs", rev = "f5b6639d9664098c71a6ab407d006653eed91c5b" }
chip-core = { git = "https://github.com/rkendel1/chip-rs", rev = "f5b6639d9664098c71a6ab407d006653eed91c5b" }
chip-remote-env = { git = "https://github.com/rkendel1/chip-rs", rev = "f5b6639d9664098c71a6ab407d006653eed91c5b" }
compute-agent = { path = "../compute-agent" }
compute-core = { path = "../compute-core" }
compute-provider = { path = "../compute-provider" }
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true

[dev-dependencies]
fx-core = { git = "https://github.com/rkendel1/chip-rs", rev = "f5b6639d9664098c71a6ab407d006653eed91c5b" }
chip-pax = { git = "https://github.com/rkendel1/chip-rs", rev = "f5b6639d9664098c71a6ab407d006653eed91c5b" }
serde_json.workspace = true
async-trait.workspace = true
tempfile.workspace = true
