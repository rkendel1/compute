name: distribution-certification

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  certify-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/compute-appport/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - run: npm ci && npm run build
        working-directory: packages/compute-appport
      - run: cargo build --release --locked
      - uses: actions/download-artifact@v4
        with:
          name: compute-runtime-payload-linux-x86_64
          path: runtime-payload
      - run: distribution/prepare-certification-fixtures.sh runtime-payload
      - run: distribution/assemble.sh target/release/compute runtime-payload linux-x86_64 compute-distribution
      - run: distribution/certify-distribution.sh compute-distribution
