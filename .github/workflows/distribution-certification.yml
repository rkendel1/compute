name: distribution-certification

permissions:
  contents: write

on:
  workflow_call:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  certify-linux-x86_64:
    # This is the certified Linux ABI baseline. Do not let ubuntu-latest move
    # the minimum glibc version of an already-defined distribution target.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: compatibility/published-stack/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/compute/runtimes
          key: compute-runtimes-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('distribution/runtime-lock.json', 'packages/compute-appport/package-lock.json') }}
      - run: cargo build --release --locked
      - run: target/release/compute distribution build --output compute-distribution --status certified --verify
      - run: target/release/compute distribution verify compute-distribution --json
      - run: test "$(compute-distribution/bin/compute recipe starters --json | jq length)" = 7
      - run: distribution/certify-distribution.sh compute-distribution
      - run: |
          mv compute-distribution compute-distribution-first
          mv compute-distribution.tar compute-distribution-first.tar
          target/release/compute distribution build --output compute-distribution --status certified --offline --verify
          diff -u compute-distribution-first/runtime-manifest.json compute-distribution/runtime-manifest.json
          diff -u compute-distribution-first/runtime-inventory.json compute-distribution/runtime-inventory.json
          cmp compute-distribution-first.tar compute-distribution.tar
      - name: Package the certified artifact
        id: package
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "compute-cli") | .version')
          fi
          package_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "compute-cli") | .version')
          test "$version" = "$package_version"
          asset="compute-$version-linux-x86_64.tar.gz"
          gzip -n -9 -c compute-distribution.tar > "$asset"
          gzip -dc "$asset" | cmp - compute-distribution.tar
          sha256sum "$asset" > "$asset.sha256"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
      - name: Sync published-stack version with current release
        run: distribution/scripts/update-stack-version.sh
      - name: Assemble the configured product from published packages
        id: configured
        shell: bash
        run: |
          npm ci --ignore-scripts --prefix compatibility/published-stack
          distribution/scripts/build-configured-agent.sh compatibility/published-stack "$(command -v node)"
          SOURCE_DATE_EPOCH=0 COMPUTE_COMPATIBILITY_EVIDENCE="$RUNNER_TEMP/configured-evidence.json" \
            npm run verify --prefix compatibility/published-stack
          test "$(jq -r .status "$RUNNER_TEMP/configured-evidence.json")" = certified
          test "$(jq -r .platform "$RUNNER_TEMP/configured-evidence.json")" = linux-x86_64
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "compute-cli") | .version')
          test "$(jq -r .compute compatibility/published-stack/stack.json)" = "$version"
          root=compute-configured
          mkdir -p "$root/stacks/configured"
          cp compatibility/published-stack/package.json "$root/package.json"
          cp compatibility/published-stack/package-lock.json "$root/package-lock.json"
          cp compatibility/published-stack/stack.json "$root/stack.json"
          cp compatibility/published-stack/verify.mjs "$root/verify.mjs"
          cp compatibility/published-stack/stack.toml "$root/stacks/configured/stack.toml"
          cp "$RUNNER_TEMP/configured-evidence.json" "$root/evidence.json"
          cp -a compute-distribution/recipes "$root/recipes"
          cp -a compatibility/published-stack/node_modules "$root/node_modules"
          cp -R compatibility/published-stack/agent "$root/agent"
          cp -R compatibility/published-stack/.output "$root/.output"
          test "$(find "$root/recipes/starters" -name '*.json' -type f | wc -l | tr -d '[:space:]')" = 7
          asset="compute-configured-$version-linux-x86_64.tar.gz"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -cf - "$root" | gzip -n -9 > "$asset"
          sha256sum "$asset" > "$asset.sha256"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
      # The Chip launcher is proved against the tree this job just assembled and
      # is about to publish, not against the source checkout. COMPUTE_TEST_NODE
      # is the runner's Node: the formula resolves the Node the installed
      # distribution bundles, and on a build runner that role is played by the
      # runner's own -- the same major the profile requires. The launcher is
      # required, not optional, so a regression here fails certification instead
      # of degrading to a skip.
      - name: Prove the configured Chip launcher against the assembled distribution
        run: |
          COMPUTE_TEST_MODULES="compute-configured/node_modules" \
          COMPUTE_TEST_NODE="$(command -v node)" \
          COMPUTE_TEST_REQUIRE_RUNTIME=1 \
            distribution/tests/configured-chip.sh
      # The configured runtime path, on the same assembled bytes: the rendered
      # launcher starts the real Chip, which serves the configured agent through
      # FX to a local OpenAI-compatible fixture, and records operationId behavior.
      - name: Prove Chip -> FX -> provider against the assembled distribution
        run: |
          COMPUTE_TEST_CONFIGURED_ROOT="compute-configured" \
          COMPUTE_TEST_NODE="$(command -v node)" \
          COMPUTE_TEST_EVIDENCE="$RUNNER_TEMP/configured-chip-fx.json" \
            distribution/tests/configured-chip-fx.sh
      - name: The configured asset names no machine-specific path
        run: distribution/scripts/check-configured-paths.sh compute-configured
      - uses: actions/upload-artifact@v4
        with:
          name: certified-compute-linux-x86_64
          path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.asset }}.sha256
            ${{ steps.configured.outputs.asset }}
            ${{ steps.configured.outputs.asset }}.sha256
          if-no-files-found: error
  validate-macos-aarch64-preview:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: compatibility/published-stack/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/compute/runtimes
          key: compute-runtimes-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('distribution/runtime-lock.json', 'packages/compute-appport/package-lock.json') }}
      - name: Confirm preview platform
        run: test "$(uname -s)-$(uname -m)" = Darwin-arm64
      - run: cargo build --release --locked
      - run: target/release/compute distribution build --output compute-distribution --status preview
      - run: target/release/compute distribution verify compute-distribution --json
      - run: test "$(compute-distribution/bin/compute recipe starters --json | jq length)" = 7
      - name: Verify preview evidence
        run: |
          test "$(jq -r .release_status compute-distribution/runtime-manifest.json)" = preview
          test "$(jq -r .platform compute-distribution/runtime-manifest.json)" = macos-aarch64
          test "$(jq -r .runtimes.node.availability compute-distribution/runtime-manifest.json)" = supported
          test "$(jq -r .runtimes.native.availability compute-distribution/runtime-manifest.json)" = unavailable
          test "$(jq -r .runtimes.php.availability compute-distribution/runtime-manifest.json)" = unavailable
          test "$(jq -r .runtimes.shell.availability compute-distribution/runtime-manifest.json)" = unavailable
      - name: Package the preview artifact
        id: package
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "compute-cli") | .version')
          fi
          package_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "compute-cli") | .version')
          test "$version" = "$package_version"
          asset="compute-$version-macos-aarch64.tar.gz"
          gzip -n -9 -c compute-distribution.tar > "$asset"
          gzip -dc "$asset" | cmp - compute-distribution.tar
          shasum -a 256 "$asset" > "$asset.sha256"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
      - name: Assemble the configured preview from published packages
        id: configured
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "compute-cli") | .version')
          cp -R compatibility/published-stack configured-stack
          jq --arg version "$version" \
            '.compute=$version | .platform="macos-aarch64" | .distribution.identity=("compute-configured-"+$version+"-macos-aarch64") | .distribution.certification_status="preview" | .distribution.base_asset=("compute-"+$version+"-macos-aarch64.tar.gz") | .distribution.configured_asset=("compute-configured-"+$version+"-macos-aarch64.tar.gz") | .distribution.release=("https://github.com/rkendel1/compute/releases/tag/v"+$version)' \
            configured-stack/stack.json > "$RUNNER_TEMP/stack.json"
          mv "$RUNNER_TEMP/stack.json" configured-stack/stack.json
          npm ci --ignore-scripts --prefix configured-stack
          distribution/scripts/build-configured-agent.sh configured-stack "$(command -v node)"
          SOURCE_DATE_EPOCH=0 COMPUTE_COMPATIBILITY_EVIDENCE="$RUNNER_TEMP/configured-evidence.json" \
            npm run verify --prefix configured-stack
          test "$(jq -r .status "$RUNNER_TEMP/configured-evidence.json")" = preview
          test "$(jq -r .platform "$RUNNER_TEMP/configured-evidence.json")" = macos-aarch64
          root=compute-configured
          mkdir -p "$root/stacks/configured"
          cp configured-stack/package.json "$root/package.json"
          cp configured-stack/package-lock.json "$root/package-lock.json"
          cp configured-stack/stack.json "$root/stack.json"
          cp configured-stack/verify.mjs "$root/verify.mjs"
          cp configured-stack/stack.toml "$root/stacks/configured/stack.toml"
          cp "$RUNNER_TEMP/configured-evidence.json" "$root/evidence.json"
          cp -a compute-distribution/recipes "$root/recipes"
          cp -a configured-stack/node_modules "$root/node_modules"
          cp -R configured-stack/agent "$root/agent"
          cp -R configured-stack/.output "$root/.output"
          test "$(find "$root/recipes/starters" -name '*.json' -type f | wc -l | tr -d '[:space:]')" = 7
          asset="compute-configured-$version-macos-aarch64.tar.gz"
          brew install gnu-tar
          gtar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -cf - "$root" | gzip -n -9 > "$asset"
          shasum -a 256 "$asset" > "$asset.sha256"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
      - name: Prove the configured Chip launcher and Chip -> FX -> provider on the preview
        run: |
          COMPUTE_TEST_MODULES="compute-configured/node_modules" \
          COMPUTE_TEST_NODE="$(command -v node)" \
          COMPUTE_TEST_REQUIRE_RUNTIME=1 \
            distribution/tests/configured-chip.sh
          COMPUTE_TEST_CONFIGURED_ROOT="compute-configured" \
          COMPUTE_TEST_NODE="$(command -v node)" \
          COMPUTE_TEST_EVIDENCE="$RUNNER_TEMP/configured-chip-fx.json" \
            distribution/tests/configured-chip-fx.sh
          distribution/scripts/check-configured-paths.sh compute-configured
      - uses: actions/upload-artifact@v4
        with:
          name: preview-compute-macos-aarch64
          path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.asset }}.sha256
            ${{ steps.configured.outputs.asset }}
            ${{ steps.configured.outputs.asset }}.sha256
          if-no-files-found: error
  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [certify-linux-x86_64, validate-macos-aarch64-preview]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: "*-compute-*"
          path: release-assets
          merge-multiple: true
      - name: Publish certified and preview release assets atomically
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/compute-*.tar.gz
            release-assets/compute-*.tar.gz.sha256
          fail_on_unmatched_files: true
          draft: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
      # The tap's own schedule would pick the release up within the hour; this
      # makes publication and the formula update one event. The tap re-resolves
      # the latest complete release itself, so a failed dispatch costs only the
      # wait for its next scheduled run. The token is a fine-grained PAT with
      # Actions: write on rkendel1/homebrew-compute only; GITHUB_TOKEN cannot
      # dispatch workflows in another repository.
      - name: Trigger the Homebrew tap sync
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set; the tap will update only on its hourly schedule"
            exit 1
          fi
          gh workflow run sync.yml --repo rkendel1/homebrew-compute --ref main
