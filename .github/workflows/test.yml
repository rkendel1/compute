name: test

# The whole workspace, including the provider-neutral product acceptance
# (crates/compute-cli/tests/product.rs): an application is deployed,
# replaced, rolled back, stopped, and its receipts verified, on ordinary
# Compute providers on this runner, and every provider type is crossed
# with every execution mode. Then the AppPort contract
# (packages/compute-appport), whose tests drive the compute binary,
# including an agent deploying an application through AppPort. Managed
# runtimes in tests come from a host-backed fixture catalog, so no test
# downloads one.
#
# `browser` certifies the control-plane UI in Chromium against real
# daemons and targets: the operator journey, computers that become
# unreachable, lost, recovered, and replaced, an application deployed,
# observed, logged, and rolled back as its computer and versions, Work mode,
# and the whole product from one command. A missing browser fails it;
# nothing skips. Each file launches a whole Compute on the runner, so they
# run one at a time.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Workspace tests
        run: cargo test --workspace --locked
      - name: Installer contract
        run: distribution/tests/installer.sh
      - name: Homebrew contract
        run: distribution/tests/homebrew.sh
      - name: Product acceptance
        run: cargo test --locked -p compute-cli --test product -- --nocapture
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: AppPort contract
        working-directory: packages/compute-appport
        run: |
          npm ci
          npm test

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Compute
        run: cargo build --locked -p compute-cli
      - name: Install Chromium
        working-directory: packages/compute-ui-e2e
        run: |
          npm ci
          npx playwright-core install --with-deps chromium
          echo "CHROMIUM_PATH=$(node --input-type=module -e "import { chromium } from 'playwright-core'; console.log(chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: UI certification
        working-directory: packages/compute-ui-e2e
        run: npm test
      - name: Work mode and the whole product, in the browser
        env:
          COMPUTE_REQUIRE_BROWSER: "1"
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/packages/compute-ui-e2e/node_modules/playwright-core/index.mjs
        run: |
          COMPUTE_UI_CHROMIUM="$CHROMIUM_PATH" cargo test --locked -p compute-cli \
            --test work_mode_ui --test product_journey -- --nocapture
