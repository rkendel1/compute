name: feltdb-consumer

# Compute as a consumer of the certified FeltDB release. Compute talks to
# FeltDB through the native `feltdb-client` crate, pinned exactly to
# CERTIFIED_FELTDB_VERSION, and every test runs against `feltdb-server` from
# crates.io at that same version. npm's @feltdb/core is only the model
# compiler (MODEL_COMPILER_VERSION); the server bundled in it, which Compute
# was certified against before the crates existed, is the "previous" server
# whose state must open on the certified one.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable

      - name: Install the model compiler (lockfile only)
        working-directory: packages/compute-state-model
        run: npm ci

      - name: Verify the resolved @feltdb/core is the certified one
        run: node scripts/feltdb/verify-version.mjs --json

      - name: The checked-in manifest is compute.flow compiled by it
        working-directory: packages/compute-state-model
        run: npm run check && npm test

      - name: Install the certified feltdb-server from crates.io
        run: |
          version=$(sed -n 's/^pub const CERTIFIED_FELTDB_VERSION: &str = "\(.*\)";$/\1/p' crates/compute-state-feltdb/src/lib.rs)
          test -n "$version"
          CARGO_TARGET_DIR="$RUNNER_TEMP/feltdb" cargo install feltdb-server --version "=$version" --locked --root "$RUNNER_TEMP/feltdb-server"
          echo "FELTDB_SERVER_BIN=$RUNNER_TEMP/feltdb-server/bin/feltdb-server" >> "$GITHUB_ENV"

      - name: Build the previous server (bundled in @feltdb/core), for compatibility
        run: |
          source=packages/compute-state-model/node_modules/@feltdb/core/dist/create/server-source
          CARGO_TARGET_DIR="$RUNNER_TEMP/feltdb-previous" cargo build --release --locked --manifest-path "$source/Cargo.toml" -p feltdb-server
          echo "FELTDB_PREVIOUS_SERVER_BIN=$RUNNER_TEMP/feltdb-previous/release/feltdb-server" >> "$GITHUB_ENV"

      - name: State backends conform
        run: cargo test --locked -p compute-state -p compute-state-memory -p compute-state-file -p compute-state-feltdb

      - name: The FeltDB backend against the certified feltdb-server
        run: cargo test --locked -p compute-state-feltdb -- --ignored --test-threads 1

      - name: The controller against the certified feltdb-server
        run: cargo test --locked -p compute-environment --test feltdb_consumer -- --ignored --test-threads 1 --skip benchmark
