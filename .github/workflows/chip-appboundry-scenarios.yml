name: chip-appboundry-scenarios

# Real-boundary tests of what Chip reports when a scripted createFxModel() endpoint drives a tool call into a real
# AppBoundry host running a verified WASM application (compatibility/published-stack/scenarios).
#
# Manual, not on pull requests, for two stated reasons:
#   * The AppBoundry MCP host is in no published release (appport@1.1.20 lacks it), so this builds AppBoundry from an
#     EXPLICIT COMMIT, never a branch. Bumping the pin is a reviewed change to APPBOUNDRY_COMMIT below, and the test
#     itself fails if the checkout is not that commit.
#   * Until a Chip release containing the observable-outcome fixes is published and pinned in the stack, the scenarios
#     that assert those fixes need a candidate Chip: set `chip_ref` to build one from rkendel1/eve. Once the stack
#     pins the release, leave `chip_ref` empty to test exactly the published package.
on:
  workflow_dispatch:
    inputs:
      chip_ref:
        description: "rkendel1/eve ref to build and test as a candidate @appport/chip (empty: the Chip pinned in the stack)"
        required: false
        default: ""

permissions:
  contents: read

env:
  # rkendel1/appboundry@4e50aeb plus the host HTTP token boundary. Immutable: a commit, not a branch.
  APPBOUNDRY_COMMIT: d96e3a918da431d60354467f369388a9c8d768ee

jobs:
  scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Check out AppBoundry at the pinned commit
        uses: actions/checkout@v5
        with:
          repository: rkendel1/appboundry
          ref: ${{ env.APPBOUNDRY_COMMIT }}
          # rkendel1/appboundry is private: a token with read access to it.
          token: ${{ secrets.APPBOUNDRY_READ_TOKEN }}
          path: appboundry
      - name: Verify the checkout is the pinned commit and build it
        working-directory: appboundry
        run: |
          test "$(git rev-parse HEAD)" = "$APPBOUNDRY_COMMIT"
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build a candidate Chip from rkendel1/eve
        if: ${{ inputs.chip_ref != '' }}
        run: |
          git clone --quiet https://github.com/rkendel1/eve eve
          git -C eve checkout --quiet "${{ inputs.chip_ref }}"
          echo "candidate Chip from rkendel1/eve@$(git -C eve rev-parse HEAD)"
          (cd eve && pnpm install --frozen-lockfile && pnpm --filter eve build && node scripts/prepare-chip-package.mjs --pack)
          tarball="$(ls eve/.chip-staging/appport-chip-*.tgz)"
          sha256sum "$tarball"
          echo "CHIP_TARBALL=$PWD/$tarball" >> "$GITHUB_ENV"

      - name: Install the pinned stack
        working-directory: compatibility/published-stack
        run: npm ci --ignore-scripts

      - name: Run the scenarios
        working-directory: compatibility/published-stack
        env:
          APPBOUNDRY_DIR: ${{ github.workspace }}/appboundry
        run: node --test scenarios/outcomes.test.mjs
