name: sync-certified-release

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  formula:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Resolve latest certified release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh api repos/rkendel1/compute/releases/latest > "$RUNNER_TEMP/release.json"; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag=$(jq -r .tag_name "$RUNNER_TEMP/release.json")
          [[ "$tag" == v* ]]
          version="${tag#v}"
          asset="compute-$version-linux-x86_64.tar.gz"
          archive_url=$(jq -r --arg name "$asset" '.assets[] | select(.name == $name) | .browser_download_url' "$RUNNER_TEMP/release.json")
          checksum_url=$(jq -r --arg name "$asset.sha256" '.assets[] | select(.name == $name) | .browser_download_url' "$RUNNER_TEMP/release.json")
          test -n "$archive_url"
          test -n "$checksum_url"
          checksum=$(curl -fsSL --proto '=https' --proto-redir '=https' "$checksum_url" | cut -d ' ' -f 1)
          [[ "$checksum" =~ ^[0-9a-fA-F]{64}$ ]]
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
          echo "archive_url=$archive_url" >> "$GITHUB_OUTPUT"
      - name: Render formula from release checksum
        if: steps.release.outputs.available == 'true'
        run: scripts/update-formula.sh '${{ steps.release.outputs.version }}' '${{ steps.release.outputs.checksum }}'
      - name: Verify formula contract
        if: steps.release.outputs.available == 'true'
        shell: bash
        run: |
          grep -F 'url "${{ steps.release.outputs.archive_url }}"' Formula/compute.rb
          grep -F 'version "${{ steps.release.outputs.version }}"' Formula/compute.rb
          grep -F 'sha256 "${{ steps.release.outputs.checksum }}"' Formula/compute.rb
          ruby -c Formula/compute.rb
      - name: Publish formula
        if: steps.release.outputs.available == 'true'
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Formula/compute.rb
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "compute ${{ steps.release.outputs.version }}"
          git push
