name: sync-compute-release

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  formula:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Resolve latest complete platform release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh api repos/rkendel1/compute/releases/latest > "$RUNNER_TEMP/release.json"; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag=$(jq -r .tag_name "$RUNNER_TEMP/release.json")
          [[ "$tag" == v* ]]
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          asset="compute-$version-linux-x86_64.tar.gz"
          configured_asset="compute-configured-$version-linux-x86_64.tar.gz"
          macos_asset="compute-$version-macos-aarch64.tar.gz"
          macos_configured_asset="compute-configured-$version-macos-aarch64.tar.gz"
          archive_url=$(jq -r --arg name "$asset" '.assets[] | select(.name == $name) | .browser_download_url' "$RUNNER_TEMP/release.json")
          checksum_url=$(jq -r --arg name "$asset.sha256" '.assets[] | select(.name == $name) | .browser_download_url' "$RUNNER_TEMP/release.json")
          configured_url=$(jq -r --arg name "$configured_asset" '.assets[] | select(.name == $name) | .browser_download_url' "$RUNNER_TEMP/release.json")
          configured_checksum_url=$(jq -r --arg name "$configured_asset.sha256" '.assets[] | select(.name == $name) | .browser_download_url' "$RUNNER_TEMP/release.json")
          macos_url=$(jq -r --arg name "$macos_asset" '.assets[] | select(.name == $name) | .browser_download_url' "$RUNNER_TEMP/release.json")
          macos_checksum_url=$(jq -r --arg name "$macos_asset.sha256" '.assets[] | select(.name == $name) | .browser_download_url' "$RUNNER_TEMP/release.json")
          macos_configured_url=$(jq -r --arg name "$macos_configured_asset" '.assets[] | select(.name == $name) | .browser_download_url' "$RUNNER_TEMP/release.json")
          macos_configured_checksum_url=$(jq -r --arg name "$macos_configured_asset.sha256" '.assets[] | select(.name == $name) | .browser_download_url' "$RUNNER_TEMP/release.json")
          test -n "$archive_url"
          test -n "$checksum_url"
          test -n "$configured_url"
          test -n "$configured_checksum_url"
          test -n "$macos_url"
          test -n "$macos_checksum_url"
          test -n "$macos_configured_url"
          test -n "$macos_configured_checksum_url"
          checksum=$(curl -fsSL --proto '=https' --proto-redir '=https' "$checksum_url" | cut -d ' ' -f 1)
          configured_checksum=$(curl -fsSL --proto '=https' --proto-redir '=https' "$configured_checksum_url" | cut -d ' ' -f 1)
          macos_checksum=$(curl -fsSL --proto '=https' --proto-redir '=https' "$macos_checksum_url" | cut -d ' ' -f 1)
          macos_configured_checksum=$(curl -fsSL --proto '=https' --proto-redir '=https' "$macos_configured_checksum_url" | cut -d ' ' -f 1)
          [[ "$checksum" =~ ^[0-9a-fA-F]{64}$ ]]
          [[ "$configured_checksum" =~ ^[0-9a-fA-F]{64}$ ]]
          [[ "$macos_checksum" =~ ^[0-9a-fA-F]{64}$ ]]
          [[ "$macos_configured_checksum" =~ ^[0-9a-fA-F]{64}$ ]]
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
          echo "configured_checksum=$configured_checksum" >> "$GITHUB_OUTPUT"
          echo "macos_checksum=$macos_checksum" >> "$GITHUB_OUTPUT"
          echo "macos_configured_checksum=$macos_configured_checksum" >> "$GITHUB_OUTPUT"
          echo "archive_url=$archive_url" >> "$GITHUB_OUTPUT"
          echo "configured_url=$configured_url" >> "$GITHUB_OUTPUT"
          echo "macos_url=$macos_url" >> "$GITHUB_OUTPUT"
          echo "macos_configured_url=$macos_configured_url" >> "$GITHUB_OUTPUT"
      - name: Take the formula templates from the release tag
        if: steps.release.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # The template is the shipped contract, so it comes from the tag whose
          # assets these formulas install. Re-rendering from this repository's own
          # copy silently ships a stale wrapper: that is how a release lost
          # COMPUTE_CONFIGURED_HOME and stopped starting AppPort Services.
          for path in \
            distribution/homebrew/Formula/compute.rb.in \
            distribution/homebrew/Formula/compute-configured.rb.in \
            distribution/homebrew/scripts/update-formula.sh; do
            mkdir -p "$(dirname "$path")"
            gh api "repos/rkendel1/compute/contents/$path?ref=${{ steps.release.outputs.tag }}" \
              --jq .content | base64 -d > "$path"
          done
          chmod +x scripts/update-formula.sh
          # Fail before publishing if the release's wrapper cannot manage services.
          grep -F 'export COMPUTE_CONFIGURED_HOME=' distribution/homebrew/Formula/compute-configured.rb.in
      - name: Render formula from release checksum
        if: steps.release.outputs.available == 'true'
        run: scripts/update-formula.sh '${{ steps.release.outputs.version }}' '${{ steps.release.outputs.checksum }}' '${{ steps.release.outputs.configured_checksum }}' '${{ steps.release.outputs.macos_checksum }}' '${{ steps.release.outputs.macos_configured_checksum }}'
      - name: Verify formula contract
        if: steps.release.outputs.available == 'true'
        shell: bash
        run: |
          grep -F 'releases/download/v${{ steps.release.outputs.version }}/compute-${{ steps.release.outputs.version }}-#{platform}.tar.gz' Formula/compute.rb
          grep -F 'releases/download/v${{ steps.release.outputs.version }}/compute-configured-${{ steps.release.outputs.version }}-#{platform}.tar.gz' Formula/compute-configured.rb
          grep -F 'platform = OS.mac? ? "macos-aarch64" : "linux-x86_64"' Formula/compute.rb
          grep -F 'platform = OS.mac? ? "macos-aarch64" : "linux-x86_64"' Formula/compute-configured.rb
          grep -F '"${{ steps.release.outputs.checksum }}"' Formula/compute.rb
          grep -F '"${{ steps.release.outputs.macos_checksum }}"' Formula/compute.rb
          grep -F '"${{ steps.release.outputs.configured_checksum }}"' Formula/compute-configured.rb
          grep -F '"${{ steps.release.outputs.macos_configured_checksum }}"' Formula/compute-configured.rb
          ruby -c Formula/compute.rb
          ruby -c Formula/compute-configured.rb
      - name: Publish formula
        if: steps.release.outputs.available == 'true'
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Formula/compute.rb Formula/compute-configured.rb
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "compute ${{ steps.release.outputs.version }}"
          git push
